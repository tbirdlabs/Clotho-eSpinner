<text class="ts" x="340" y="471" text-anchor="middle">No DIP switches. Factory set for 4 pole pairs,</text>
<text class="ts" x="340" y="487" text-anchor="middle">3,500 RPM max, which is right for the 57BSD76.</text>
<text class="ts" x="340" y="503" text-anchor="middle">Start both trim pots fully counterclockwise.</text>

