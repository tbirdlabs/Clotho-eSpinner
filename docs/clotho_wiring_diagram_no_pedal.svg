<text class="tw" x="340" y="789" text-anchor="middle">10K</text>
<text class="tw" x="340" y="838" text-anchor="middle">Shaft toward you, pins down</text>
<text class="th" x="340" y="860" text-anchor="middle">Panel speed pot</text>

<!-- ===== DIRECTION REFERENCE ===== -->
<rect x="20" y="895" width="640" height="155" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="340" y="923" text-anchor="middle">Switch positions and spin direction</text>
<text class="th" x="40" y="950">S twist</text>
<text class="ts" x="120" y="950">Switch one way → EN to GND (run), F/R open → clockwise</text>
<text class="th" x="40" y="973">OFF</text>
<text class="ts" x="120" y="973">Switch center → EN open → motor coasts to a stop (also clears an alarm)</text>
<text class="th" x="40" y="996">Z twist</text>
<text class="ts" x="120" y="996">Switch other way → EN and F/R to GND → counterclockwise</text>
<text class="ts" x="340" y="1020" text-anchor="middle">Pause in the center until the flyer stops before reversing.</text>
<text class="ts" x="340" y="1038" text-anchor="middle">If S and Z are backwards, pop the switch out and flip it — the mount is symmetrical.</text>

<!-- ===== WIRE COLOR WARNING ===== -->
<rect x="20" y="1060" width="640" height="50" rx="6" fill="#FEF9E7" stroke="#AE8B00" stroke-width="0.5"/>
<text class="ts" x="340" y="1080" text-anchor="middle" fill="#7A6200">⚠  Phase wires and hall wires are both Yellow / Green / Blue.</text>
<text class="ts" x="340" y="1096" text-anchor="middle" fill="#7A6200">Phase leads are thick (20 AWG). Hall leads are thin (26 AWG). Don't mix them up.</text>

<!-- ===== DRIVER VERSION NOTE ===== -->
<rect x="20" y="1120" width="640" height="50" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="ts" x="340" y="1140" text-anchor="middle" fill="#7A2E14">Drawn for BLD-510B V2.0, where EN to GND = run. V2.4 inverts EN (runs when open).</text>
<text class="ts" x="340" y="1156" text-anchor="middle" fill="#7A2E14">If the motor runs with the switch centered, you have V2.4. See manual section 4.3.</text>

<text class="ts" x="340" y="1192" text-anchor="middle">Dots mark connections. Wires that cross without a dot are not connected.</text>

</svg>
